{% extends "base.html" %}
{% block title %}Cadastro de Aluno{% endblock %}

{% block content %}
<h1>Cadastro</h1>
<form method="post" action="/cadastro" class="vertical-form">
    <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" />
    </div>
    <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" />
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
    </div>
    <div class="form-group">
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="number" />
    </div>
    <div class="form-group">
        <label for="sexo">Sexo</label>
        <input id="sexo" name="sexo" value="M" type="radio" />
        <input id="sexo" name="sexo" value="F" type="radio" />
    </div>
    <div class="form-group">
        <label for="aceite">Aceito os Termos de Uso</label>
        <input id="aceite" name="aceite" type="checkbox" />
    </div>
    <div class="form-group">
        <label for="cidade">Cidade</label>
        <select id="cidade" name="cidade">
            <option value="JP">João Pessoa</option>
            <option value="SR">Santa Rita</option>
        </select>
    </div>
    <button type="submit">Enviar</button>
</form>
{% endblock %}
